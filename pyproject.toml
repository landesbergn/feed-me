[project]
name = "feed-me"
version = "0.1.0"
description = "Personal podcast feed of AI-narrated articles"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "readability-lxml>=0.8.1",
  "lxml>=5.0",
  "openai>=1.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
