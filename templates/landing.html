<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include "_ga.html" %}
  <title>Feed Me · your private podcast feed</title>
  <meta name="description" content="Your articles read to you in a private podcast feed.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Feed Me">
  <meta property="og:title" content="Feed Me">
  <meta property="og:description" content="Your articles read to you in a private podcast feed.">
  <meta property="og:url" content="{{ base_url }}/">
  <meta property="og:image" content="{{ base_url }}/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Feed Me. Your articles read to you in a private podcast feed.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Feed Me">
  <meta name="twitter:description" content="Your articles read to you in a private podcast feed.">
  <meta name="twitter:image" content="{{ base_url }}/og.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg: #FFF8F2; --ink: #2a1f18; --accent: #b04a00;
      --muted: #8a6f5e; --hi: #FCE3C8;
      --round: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
      --sans: -apple-system, "Helvetica Neue", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--sans); max-width: 480px; margin: 56px auto; padding: 0 22px 64px;
      line-height: 1.5; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased;
    }
    .brand {
      font-family: var(--round); font-size: 12px; font-weight: 800; letter-spacing: .08em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 18px;
    }
    h1 {
      font-family: var(--round); font-size: 32px; font-weight: 800; letter-spacing: -.015em;
      line-height: 1.12; margin: 0 0 12px; text-wrap: balance;
    }
    h1 .em { background: var(--hi); border-radius: 6px; padding: 0 6px; }
    .sub { font-size: 15px; color: var(--muted); margin: 0 0 22px; }
    .cta {
      display: inline-block; background: var(--accent); color: #fff; font-family: var(--sans);
      font-size: 15px; font-weight: 700; padding: 13px 24px; border: none; border-radius: 999px; cursor: pointer;
    }
    .sec { font-family: var(--round); font-size: 13px; font-weight: 800; color: #7a5f4e; margin: 34px 0 14px; }
    .step {
      display: flex; gap: 14px; align-items: flex-start; background: #fff; border-radius: 16px;
      padding: 15px 16px; margin-bottom: 11px; box-shadow: 0 1px 0 #F3E6D9, 0 6px 16px rgba(176, 74, 0, .05);
    }
    .step .n {
      flex: none; width: 27px; height: 27px; border-radius: 50%; background: var(--accent); color: #fff;
      font-family: var(--round); font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center;
    }
    .step { align-items: center; }
    .step .t { font-size: 15px; font-weight: 600; line-height: 1.4; color: var(--ink); }
    form { margin: 0; }
    .site-footer {
      margin-top: 48px; padding-top: 18px; border-top: 1px solid #EFE2D6;
      font-size: 12.5px; color: var(--muted);
    }
    .site-footer a { color: var(--accent); text-decoration: none; font-weight: 700; }
    .site-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="brand">🎧 Feed Me</div>
  <h1>Your articles, read to you in your own <span class="em">private</span> podcast feed.</h1>
  <p class="sub">Share an article, play it later.</p>
  <form action="/create" method="post">
    <button class="cta" type="submit">Get my feed →</button>
  </form>

  <div class="sec">How it works</div>

  <div class="step">
    <div class="n">1</div>
    <div class="t">Create your private podcast feed</div>
  </div>

  <div class="step">
    <div class="n">2</div>
    <div class="t">Share any article</div>
  </div>

  <div class="step">
    <div class="n">3</div>
    <div class="t">Listen to it in your podcast app</div>
  </div>

  <footer class="site-footer">
    Built by <a href="https://noahlandesberg.com" target="_blank" rel="noopener">Noah Landesberg</a>
  </footer>
</body>
</html>
